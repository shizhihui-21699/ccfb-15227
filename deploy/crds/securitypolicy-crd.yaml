apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: securitypolicies.guard.example.com
spec:
  group: guard.example.com
  names:
    kind: SecurityPolicy
    listKind: SecurityPolicyList
    plural: securitypolicies
    singular: securitypolicy
    shortNames: [sp]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [rules]
              properties:
                description: {type: string}
                mode:
                  type: string
                  enum: [enforce, audit]
                  default: enforce
                failureMode:
                  type: string
                  enum: [closed, open]
                  default: closed
                teamLabel: {type: string}
                maxExemptionDuration: {type: string}
                acceptExemptions:
                  type: array
                  items: {type: string}
                scope:
                  type: object
                  properties:
                    namespaces:
                      type: array
                      items: {type: string}
                    excludeNamespaces:
                      type: array
                      items: {type: string}
                    teams:
                      type: array
                      items: {type: string}
                    excludeTeams:
                      type: array
                      items: {type: string}
                    namespaceSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                rules:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: {type: string}
                      enabled: {type: boolean}
                      action:
                        type: string
                        enum: [deny, remediate, audit, warn]
                      severity:
                        type: string
                        enum: [critical, high, medium, low, info]
                      config:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                exemptions:
                  type: array
                  items:
                    type: object
                    required: [id, reason, requestedBy, expiresAt, scope]
                    properties:
                      id: {type: string}
                      reason: {type: string, minLength: 1}
                      requestedBy: {type: string, minLength: 1}
                      ticket: {type: string}
                      notBefore: {type: string, format: date-time}
                      expiresAt: {type: string, format: date-time}
                      scope:
                        type: object
                        required: [rules]
                        properties:
                          namespaces:
                            type: array
                            items: {type: string}
                          teams:
                            type: array
                            items: {type: string}
                          workloads:
                            type: array
                            items: {type: string}
                          kinds:
                            type: array
                            items: {type: string}
                          rules:
                            type: array
                            minItems: 1
                            items: {type: string}
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Rules
          type: integer
          jsonPath: .spec.rules[*].id
          priority: 1
