apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: truststores.guard.example.com
spec:
  group: guard.example.com
  names:
    kind: TrustStore
    listKind: TrustStoreList
    plural: truststores
    singular: truststore
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              properties:
                signatures:
                  type: array
                  items:
                    type: object
                    required: [image, signer]
                    properties:
                      image: {type: string}
                      signer: {type: string}
                      expiresAt: {type: string, format: date-time}
