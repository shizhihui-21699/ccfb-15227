# Default policy shipped with the guard. Edit through a GitOps pipeline (or use
# SecurityPolicy CRs and delete this ConfigMap) — the daemon polls the directory
# every 30s and keeps the last good snapshot if an edit is invalid.
apiVersion: v1
kind: ConfigMap
metadata:
  name: admission-guard-policies
  namespace: admission-guard
data:
  baseline.yaml: |
    apiVersion: guard.example.com/v1alpha1
    kind: SecurityPolicy
    metadata:
      name: baseline-hardening
    spec:
      description: Platform baseline for every namespace.
      mode: enforce
      failureMode: closed
      rules:
        - id: pod.privileged
          severity: critical
        - id: pod.allowPrivilegeEscalation
          action: remediate
          severity: high
        - id: pod.capabilities
          action: remediate
          severity: high
          config:
            allowed: [NET_BIND_SERVICE]
        - id: pod.seccompProfile
          action: remediate
          severity: high
        - id: pod.runAsNonRoot
          action: remediate
          severity: high
        - id: pod.readOnlyRootFilesystem
          action: remediate
          severity: medium
        - id: pod.hostPathVolumes
          severity: critical
        - id: pod.hostNamespaces
          severity: critical
        - id: pod.hostUsers
          severity: high
        - id: pod.hostPorts
          action: remediate
          severity: high
        - id: pod.volumeTypes
          severity: high
          config:
            allowed: [configMap, secret, emptyDir, persistentVolumeClaim, downwardAPI]
        - id: pod.serviceAccountToken
          action: remediate
          severity: medium
        - id: pod.unsafeSysctls
          severity: high
        - id: pod.ephemeralContainers
          severity: high
        - id: pod.procMount
          action: remediate
          severity: high
        - id: pod.hostProcess
          severity: critical
        - id: pod.shareProcessNamespace
          action: remediate
          severity: medium
        - id: image.digestOrPullAlways
          action: remediate
          severity: medium
        - id: image.provenance
          severity: high
          config:
            allowedRegistries: [registry.example.com]
        - id: object.unknownWorkload
          severity: high
        - id: object.malformedWorkload
          severity: high
  # Add team overlays here or as SecurityPolicy CRs. Example:
  #
  # team-payments.yaml: |
  #   apiVersion: guard.example.com/v1alpha1
  #   kind: SecurityPolicy
  #   metadata: {name: payments-validator}
  #   spec:
  #     scope: {teams: [payments]}
  #     acceptExemptions: [vendor-validator]
  #     rules: [{id: pod.runAsNonRoot, action: remediate}]
  #     exemptions:
  #       - id: vendor-validator
  #         reason: vendor image not yet mirrored (INFRA-88)
  #         requestedBy: payments
  #         expiresAt: "2027-02-01T00:00:00Z"
  #         scope: {teams: [payments], rules: [image.provenance]}
